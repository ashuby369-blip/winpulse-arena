<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>WinPulse Arena — VIP Lounge</title>
<style>
  :root {
    --bg-dark: #070b14;
    --bg-card: #0e1626;
    --bg-elevated: #152036;
    --border-subtle: rgba(255, 255, 255, 0.08);
    --gold: #f5c451;
    --gold-bright: #ffe082;
    --emerald: #10b981;
    --ruby: #ef4444;
    --sapphire: #3b82f6;
    --violet: #a855f7;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-dark);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    touch-action: manipulation;
  }

  button, input, select {
    font-family: inherit;
    touch-action: manipulation;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    background: rgba(7, 11, 20, 0.94);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-subtle);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 0.3px;
  }

  .brand-badge {
    background: linear-gradient(135deg, var(--gold), #d97706);
    color: #090d16;
    padding: 4px 8px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 900;
  }

  .wallet-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .balance-pill {
    background: var(--bg-elevated);
    border: 1px solid rgba(245, 196, 81, 0.3);
    padding: 6px 10px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    color: var(--gold-bright);
    white-space: nowrap;
  }

  .btn-deposit {
    background: linear-gradient(135deg, var(--emerald), #059669);
    color: #ffffff;
    border: none;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(16, 185, 129, 0.28);
  }

  .btn-deposit:active {
    transform: scale(0.97);
  }

  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 14px;
    padding-bottom: 56px;
  }

  .bonus-banner {
    background: linear-gradient(135deg, rgba(245, 196, 81, 0.14), rgba(59, 130, 246, 0.12));
    border: 1px solid rgba(245, 196, 81, 0.28);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 16px;
  }

  .bonus-top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }

  .bonus-title {
    font-size: 15px;
    font-weight: 800;
    color: var(--gold-bright);
  }

  .bonus-sub {
    font-size: 12px;
    color: var(--text-muted);
  }

  .progress-track {
    width: 100%;
    height: 10px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--gold), var(--emerald));
    transition: width 0.25s ease;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 6px;
  }

  .game-tabs {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }

  @media (min-width: 640px) {
    .game-tabs {
      grid-template-columns: repeat(4, 1fr);
    }
  }

  .tab-btn {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    color: var(--text-main);
    border-radius: 12px;
    padding: 12px 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
  }

  .tab-btn.active {
    background: var(--bg-elevated);
    border-color: var(--gold);
    color: var(--gold-bright);
  }

  .arena-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 16px;
  }

  .arena-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
  }

  .arena-title {
    font-size: 17px;
    font-weight: 800;
    margin: 0;
  }

  .rng-pill {
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 999px;
    background: rgba(16, 185, 129, 0.14);
    color: #6ee7b7;
    border: 1px solid rgba(16, 185, 129, 0.3);
    font-weight: 700;
  }

  .bet-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }

  .bet-input {
    width: 115px;
    background: var(--bg-dark);
    border: 1px solid var(--border-subtle);
    color: var(--text-main);
    border-radius: 10px;
    padding: 9px 10px;
    font-size: 14px;
    font-weight: 700;
  }

  .chip-btn {
    background: var(--bg-elevated);
    border: 1px solid var(--border-subtle);
    color: var(--text-main);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .action-btn {
    background: linear-gradient(135deg, var(--sapphire), #2563eb);
    color: #fff;
    border: none;
    border-radius: 11px;
    padding: 11px 16px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
  }

  .action-btn.gold {
    background: linear-gradient(135deg, var(--gold), #d97706);
    color: #080c14;
  }

  .action-btn.emerald {
    background: linear-gradient(135deg, var(--emerald), #059669);
    color: #fff;
  }

  .action-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .crash-stage {
    background: var(--bg-dark);
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    padding: 24px 16px;
    text-align: center;
    margin-bottom: 14px;
  }

  .multiplier-readout {
    font-size: 40px;
    font-weight: 900;
    color: var(--gold-bright);
    margin: 4px 0;
  }

  .multiplier-readout.crashed {
    color: var(--ruby);
  }

  .mines-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    max-width: 380px;
    margin: 12px auto;
  }

  .mine-tile {
    aspect-ratio: 1 / 1;
    border-radius: 12px;
    background: var(--bg-elevated);
    border: 1px solid var(--border-subtle);
    color: var(--text-main);
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mine-tile.safe {
    background: rgba(16, 185, 129, 0.2);
    border-color: var(--emerald);
  }

  .mine-tile.boom {
    background: rgba(239, 68, 68, 0.25);
    border-color: var(--ruby);
  }

  .color-choices {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 12px;
  }

  .color-btn {
    padding: 14px 8px;
    border-radius: 12px;
    border: 2px solid transparent;
    color: #fff;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
  }

  .color-btn.red { background: #dc2626; }
  .color-btn.green { background: #059669; }
  .color-btn.violet { background: #7c3aed; }
  .color-btn.selected { border-color: var(--gold-bright); transform: translateY(-1px); }

  .wheel-box {
    background: var(--bg-dark);
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    padding: 20px;
    text-align: center;
    margin-bottom: 12px;
  }

  .wheel-result {
    font-size: 26px;
    font-weight: 900;
    color: var(--gold-bright);
    margin: 8px 0;
  }

  .status-msg {
    font-size: 13px;
    color: var(--text-muted);
    min-height: 20px;
    margin-top: 8px;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(2, 6, 15, 0.82);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 14px;
    z-index: 100;
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal-card {
    width: 100%;
    max-width: 440px;
    max-height: 92vh;
    overflow-y: auto;
    background: var(--bg-card);
    border: 1px solid rgba(245, 196, 81, 0.3);
    border-radius: 20px;
    padding: 18px;
  }

  .modal-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .modal-title {
    margin: 0;
    font-size: 18px;
    font-weight: 800;
  }

  .close-btn {
    background: var(--bg-elevated);
    border: none;
    color: var(--text-main);
    width: 32px;
    height: 32px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
  }

  .preset-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin: 10px 0;
  }

  .preset-chip {
    background: var(--bg-elevated);
    border: 1px solid var(--border-subtle);
    color: var(--text-main);
    border-radius: 8px;
    padding: 8px 4px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .preset-chip.active {
    border-color: var(--gold);
    color: var(--gold-bright);
    background: rgba(245, 196, 81, 0.14);
  }

  .qr-panel {
    background: #ffffff;
    color: #0f172a;
    border-radius: 14px;
    padding: 14px;
    text-align: center;
    margin: 12px 0;
  }

  .qr-panel canvas {
    display: block;
    margin: 0 auto 8px;
    max-width: 100%;
    height: auto;
  }

  .upi-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: var(--bg-dark);
    border: 1px solid var(--border-subtle);
    border-radius: 10px;
    padding: 9px 12px;
    margin: 10px 0;
    font-size: 13px;
  }

  .copy-btn {
    background: var(--bg-elevated);
    border: 1px solid rgba(245, 196, 81, 0.35);
    color: var(--gold-bright);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .deep-links {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin: 10px 0;
  }

  .upi-app-link {
    display: block;
    text-align: center;
    text-decoration: none;
    background: var(--bg-elevated);
    border: 1px solid var(--border-subtle);
    color: var(--text-main);
    border-radius: 10px;
    padding: 9px 8px;
    font-size: 12px;
    font-weight: 700;
  }

  .utr-input {
    width: 100%;
    background: var(--bg-dark);
    border: 1px solid var(--border-subtle);
    color: var(--text-main);
